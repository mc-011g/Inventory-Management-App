<!DOCTYPE html>

<head>
    <title>Inventory - Register</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container-fluid">

        <div class="row vh-100">
            <div class="col-md-6 px-5">
                <div class="d-flex flex-column gap-3 p-5 mt-5 align-self-center">
                    <h2 class="mb-5 fw-bold">Inventory</h2>
                    <h3 class="">Register</h2>
                        <form th:action="@{/register}" th:object="${user}" method="post"
                            class="d-flex flex-column gap-3">
                            <input type="hidden" th:field="*{role}">
                            <div>
                                <label for="email">Email</label>
                                <input class="form-control" name="email" type="email" id="email" th:field="*{email}"
                                    maxlength="50" required />
                                <div class="text-danger" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">
                                </div>
                            </div>
                            <div>
                                <label for="firstName">First Name</label>
                                <input class="form-control" name="firstName" type="text" id="firstName"
                                    th:field="*{firstName}" maxlength="30" required />
                                <div class="text-danger" th:if="${#fields.hasErrors('firstName')}"
                                    th:errors="*{firstName}"></div>
                            </div>
                            <div>
                                <label for="lastName">Last Name</label>
                                <input class="form-control" name="lastName" type="text" id="lastName"
                                    th:field="*{lastName}" maxlength="30" required />
                                <div class="text-danger" th:if="${#fields.hasErrors('lastName')}"
                                    th:errors="*{lastName}"></div>
                            </div>
                            <div class="position-relative">
                                <label for="passwordMatch">Password</label>
                                <div class="position-relative">
                                    <input class="form-control" name="password" type="password" id="newPassword"
                                        maxlength="50" th:field="*{password}" required />
                                    <div class="text-danger" th:if="${#fields.hasErrors('password')}"
                                        th:errors="*{password}">
                                    </div>

                                    <i class="bi bi-eye" id="newPasswordDisplayToggle"
                                        style="position: absolute; right: 0.75rem; top: 0.375rem; cursor: pointer;"></i>
                                </div>
                            </div>
                            <div class="position-relative">
                                <label for="confirmPassword">Confirm Password</label>
                                <div class="position-relative">
                                    <input class="form-control" name="confirmPassword" type="password" maxlength="50"
                                        id="confirmPassword" required />
                                    <i class="bi bi-eye" id="confirmPasswordDisplayToggle"
                                        style="position: absolute; right: 0.75rem; top: 0.375rem; cursor: pointer;"></i>
                                </div>
                                <span id="passwordMatchMessage" class="text-danger" hidden>Passwords must match</span>
                            </div>
                            <button class="btn btn-primary" type="submit" name="submitButton" id="submitButton"
                                disabled>
                                Create Account
                            </button>
                        </form>
                        <div>
                            Already have an account?
                            <a href="/login">
                                Login
                            </a>
                        </div>

                </div>
            </div>
            <div class="col-md-6 d-none d-md-block bg-dark p-0">
                <img class="" src="https://reactecommerceapp.blob.core.windows.net/images/pexels-tiger-lily-4483610.jpg"
                    alt="Register Image" style="object-fit: cover; width: 100%; height: 100%;">
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" th:src="@{/js/script.js}"></script>
</body>

</html>
