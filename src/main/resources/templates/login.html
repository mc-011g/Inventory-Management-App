<!DOCTYPE html>

<head>
    <title>Inventory - Login</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>

<body>
    <div class="container-fluid">
        <div class="row vh-100">
            <div class="col-md-6 px-5">
                <div class="d-flex flex-column gap-3 p-5 mt-5 align-self-center">
                    <h2 class="mb-5 fw-bold">Inventory</h2>
                    <h3 class="">Login</h2>

                        <div th:if="${message} == 'registerSuccess'">
                            <div name="message" id="message" class="alert alert-success mb-0">Registration successful.
                            </div>
                        </div>
                        <div th:if="${message} == 'registerFailed'">
                            <div name="message" id="message" class="alert alert-success mb-0">Registration failed.</div>
                        </div>

                        <form th:action="@{/login}" method="post" class="d-flex flex-column gap-3">
                            <span th:if="${param.error}" class="alert alert-danger">
                                Invalid username or password.
                            </span>
                            <div>
                                <label for="emailInput">Email</label>
                                <input class="form-control" name="username" type="text" id="emailInput" value=""
                                    maxlength="50" required />
                            </div>
                            <div>
                                <label for="password">Password</label>
                                <div class="position-relative">
                                    <input class="form-control" name="password" type="password" id="password"
                                        maxlength="50" value="" required />
                                    <i class="bi bi-eye" id="passwordDisplayToggle"
                                        style="position: absolute; right: 0.75rem; top: 0.375rem; cursor: pointer;"></i>
                                </div>
                            </div>
                            <button class="btn btn-primary" type="submit" name="login">
                                Login
                            </button>
                        </form>
                        <div>
                            Don't have an account?
                            <a href="/register">
                                Register
                            </a>
                        </div>
                </div>
            </div>
            <div class="col-md-6 d-none d-md-block bg-dark p-0">
                <img class="" src="https://reactecommerceapp.blob.core.windows.net/images/pexels-tiger-lily-4483610.jpg"
                    alt="Login Image" style="object-fit: cover; width: 100%; height: 100%;">
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        let action = /*[[${message}]]*/ '';    
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" th:src="@{/js/script.js}"></script>

</body>

</html>
