<!DOCTYPE html>

<head>
    <title>Inventory - Profile</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>
    <nav class="navbar fixed-top navbar-expand bg-white">
        <div class="container-fluid">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarSupportedContent">
                <ul class="navbar-nav me-auto mb-lg-0 w-100 align-items-center justify-content-between">
                    <li class="nav-item">
                        <button class="btn btn-outline-secondary offcanvasSidebarToggle" type="button"
                            data-bs-toggle="offcanvas" data-bs-target="#offcanvasSidebar"
                            aria-controls="offcanvasSidebar" id="sidebarToggle">

                            <i class="bi bi-list"></i>
                        </button>
                    </li>
                    </li>
                    <div sec:authorize="hasAuthority('ADMIN')">
                        <li class="nav-item">
                            <a class="nav-link" href="/users">Users</a>
                        </li>
                    </div>
                    <li class="nav-item dropdown">
                        <a class="nav-link" href="#" id="profileDropdown" role="button" data-bs-toggle="dropdown"
                            aria-expanded="false">
                            <i class="bi bi-person-circle fs-4"></i>
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="profileDropdown">
                            <li><a class="dropdown-item" href="/profile">Profile</a></li>
                            <li>
                                <form th:action="@{/logout}" method="post">
                                    <input type="submit" class="dropdown-item" value="Logout">
                                </form>
                            </li>
                        </ul>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Offcanvas sidebar -->
    <div class="sidebar offcanvasSidebar p-4 offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar"
        aria-labelledby="offcanvasSidebarLabel">

        <div class="offcanvas-header">
            <button type="button" class="btn-close text-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>

        <a class="navbar-brand fs-2 text-white" href="/dashboard">Inventory</a>

        <ul class="offcanvas-body navbar-nav pt-3">
            <li class="nav-item">
                <i class="bi bi-grid"></i>
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <i class="bi bi-box"></i>
                <a class="nav-link" href="/products">Products</a>
            </li>
            <li class="nav-item">
                <i class="bi bi-cart"></i>
                <a class="nav-link" href="/orders">Orders</a>
            </li>
        </ul>
    </div>

    <!-- Main sidebar -->
    <div class="sidebar p-4">
        <a class="navbar-brand fs-2 text-white" href="/dashboard">Inventory</a>
        <ul class="navbar-nav pt-3">
            <li class="nav-item">
                <i class="bi bi-grid"></i>
                <a class="nav-link" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <i class="bi bi-box"></i>
                <a class="nav-link" href="/products">Products</a>
            </li>
            <li class="nav-item">
                <i class="bi bi-cart"></i>
                <a class="nav-link" href="/orders">Orders</a>
            </li>
        </ul>
    </div>

    <div class="main-content">
        <div class="content flex-grow-1 p-4 bg-body-tertiary">
            <h2 class="">Your Profile</h2>
            <div class="products-content bg-white p-4 rounded-4">
                <form th:action="@{/profile/update}" th:object="${user}" method="post" class="d-flex flex-column gap-3">
                    <input type="hidden" th:field="*{role}">
                    <div class="form-group">
                        <div id="emailField">
                            <label for="emailInput">Email</label>
                            <input class="form-control" type="email" id="emailInput" th:field="*{email}" name="email"
                                readonly />
                        </div>
                        <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                    </div>
                    <div class="form-group">
                        <div id="passwordField">
                            <label for="passwordInput">Password</label>
                            <input class="form-control" type="password" id="passwordInput" value="password"
                                name="passwordPlaceholder" readonly />
                        </div>
                    </div>
                    <div hidden id="newPasswordInputs">
                        <div class="d-flex flex-column gap-3">
                            <div class="position-relative">
                                <label for="passwordMatch">New Password</label>
                                <div class="position-relative">
                                    <input class="form-control" type="password" name="password" id="passwordMatch"
                                        th:field="*{password}" />
                                    <i class="bi bi-eye" id="passwordDisplayToggleMatch"
                                        style="position: absolute; right: 0.75rem; top: 0.375rem; cursor: pointer;"></i>
                                </div>
                                <div class="text-danger" th:if="${#fields.hasErrors('password')}"
                                    th:errors="*{password}">
                                    Password Error</div>
                            </div>
                            <div class="position-relative">
                                <label for="confirmPasswordMatch">Confirm New Password</label>
                                <div class="position-relative">
                                    <input class="form-control" type="password" value="" name="confirmPasswordMatch"
                                        id="confirmPasswordMatch" />
                                    <i class="bi bi-eye" id="confirmPasswordDisplayToggle"
                                        style="position: absolute; right: 0.75rem; top: 0.375rem; cursor: pointer;"></i>
                                </div>
                                <span id="passwordMatchMessage" class="text-danger" hidden>Passwords must match</span>
                            </div>
                        </div>
                    </div>
                    <button type="button" name="editButton" id="editButton" class="btn btn-primary"
                        onclick="setEditMode(true)">
                        Change Password
                    </button>
                    <div id="editButtons" hidden>
                        <div class="d-flex gap-3">
                            <button type="button" name="cancelButton" id="cancelButton"
                                class="btn btn-outline-primary w-100" onclick="setEditMode(false)">
                                Cancel
                            </button>
                            <button type="submit" name="submitButton" id="submitButton" class="btn btn-primary w-100"
                                disabled>
                                Save
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast align-items-center" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="toast-message"></div>
                <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script type="text/javascript" th:src="@{/js/script.js}"></script>

    <script th:inline="javascript">
        let showPasswordInputs = /*[[${showPasswordInputs}]]*/ '';
        let editMode = false;
        let action = /*[[${message}]]*/ '';
        const toastTrigger = document.getElementById('liveToastBtn');
        const toastLiveExample = document.getElementById('liveToast');
        const toastBootstrap = bootstrap.Toast.getOrCreateInstance(toastLiveExample);
        const toastMessage = document.getElementById("toast-message");

        const setEditMode = (value) => {
            editMode = value;
            changeEditDisplay();
        }

        const changeEditDisplay = () => {
            if (editMode === true) {
                document.getElementById('newPasswordInputs').hidden = false;
                document.getElementById('editButtons').hidden = false;
                document.getElementById('editButton').hidden = true;
            } else {
                document.getElementById('passwordField').hidden = false;
                document.getElementById('editButtons').hidden = true;
                document.getElementById('newPasswordInputs').hidden = true;
                document.getElementById('editButton').hidden = false;
            }
        }

        if (showPasswordInputs) {
            editMode = true;
            changeEditDisplay();
        }

        if (action !== null) {
            if (action === 'saveProfile') {
                toastMessage.innerText = "Saved profile.";
            }
            toastBootstrap.show()
        }    
    </script>
</body>

</html>
